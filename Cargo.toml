[package]
name = "SecurityService"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = {version = "1.53.1", features = ["full"]}
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "macros", "migrate","json", "chrono", "uuid", "mysql-rsa" ] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
dotenvy="0.15.7"
jwt-simple = { version = "0.13.1", default-features = false, features = ["pure-rust"] }
argon2 = "0.5"
thiserror = "2.0.20"
jsonwebtoken = "11.1.0"